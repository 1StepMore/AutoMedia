# AutoMedia default configuration
# Built-in defaults — lowest priority, overridden by .automedia/, ~/.automedia/, env, and CLI flags.

project:
  name: AutoMedia
  version: 1.0.0
  description: Automated multi-platform content publishing system

paths:
  data_dir: ./data
  output_dir: ./output
  cache_dir: ./cache
  log_dir: ./logs
  pool_db: ./data/pool.db

llm:
  text_generation:
    provider: openai
    model: gpt-4o-mini
    api_key: ""
    temperature: 0.7
    max_tokens: 2048
    timeout: 60

content:
  default_tone: neutral
  default_language: zh
  min_title_length: 10
  max_title_length: 100

platforms:
  wechat:
    enabled: false
    adapter: wechat
    default_style: article
  zhihu:
    enabled: false
    adapter: zhihu
    default_style: answer
  xiaohongshu:
    enabled: false
    adapter: xiaohongshu
    default_style: note
  youtube:
    enabled: false
    adapter: youtube
    default_style: video
  tiktok:
    enabled: false
    adapter: tiktok
    default_style: short_video
  twitter:
    enabled: false
    adapter: twitter
    default_style: tweet
  bilibili:
    enabled: false
    adapter: bilibili
    default_style: video

cron:
  enabled: true
  jobs_dir: automedia/cron/jobs.yaml

pool:
  retention_days: 7
  max_pending_topics: 1000
  enable_llm_scoring: true

gate_engine:
  # Total attempts for a retry-mode gate that raises a transient exception
  # (tenacity stop_after_attempt), not "retries after the first attempt".
  max_retries: 3
  retry_delay: 1.0
  max_quality_retries: 3
  max_regenerations: 2
  # H0 human-review pause budget, in seconds. Was a hardcoded 86400 (24h) in
  # runner.py, which made a non-interactive `automedia run` hang for a day and
  # then silently auto-approve. Override per run with `--hitl-timeout`.
  hitl_timeout_s: 3600
  # What a timed-out H0 pause does. "reject" fails the pipeline instead of
  # shipping unreviewed content; "approve" restores the old fail-open
  # behaviour. Override per run with `--hitl-on-timeout`.
  hitl_on_timeout: reject

engines:
  tts:
    default: piper
    # Ordered fallback chain (highest priority first). Piper is the offline
    # guarantee and matches ``default`` above; Edge-TTS is the cloud fallback
    # for machines with no Piper voice model installed.
    chain: [piper, edge-tts]
    fallback:
      - edge-tts
    piper:
      # Absolute path to a Piper .onnx voice model (with its .onnx.json next
      # to it). Leave null and set AUTOMEDIA_PIPER_MODEL_PATH (or the legacy
      # AUTOMEDIA_PIPER_MODEL) instead — do not hardcode a machine path here.
      model_path: null
      speaker: 0
      length_scale: 1.0
      bitrate: 192
      sample_rate: 44100
    edge-tts:
      voice: zh-CN-YunxiNeural
  asr:
    default: faster-whisper
    # Ordered fallback chain (highest priority first).
    chain: [whisper, faster-whisper]
    fallback:
      - whisper
    faster-whisper:
      # Local CTranslate2 model directory. Leave null to use the
      # AUTOMEDIA_FASTER_WHISPER_MODEL env var or the "tiny" size name
      # (downloaded by the library on first use).
      model_path: null
      compute_type: int8
      language: zh
    whisper:
      model: tiny
      language: zh
  image:
    default: comfyui
    # Ordered fallback chain: ComfyUI when reachable, otherwise the local
    # deterministic Pillow renderer (offline, always available).
    chain: [comfyui, local]
    fallback:
      - local
    local:
      # Optional explicit CJK-capable TTF/TTC path. Leave null to let the
      # engine probe wqy-zenhei → wqy-microhei → DejaVuSans → Pillow default.
      font_path: null
    comfyui:
      host: 127.0.0.1
      port: 8188
      protocol: http
      timeout: 900
      negative_prompt: blurry, low quality, distorted
      base_size: 512
      upscale_model: RealESRGAN_x4plus.pth
      # Absolute path to the ComfyUI `models/` directory. Only read by
      # `automedia doctor` so it can verify the upscale model exists; the
      # engine lets ComfyUI resolve the file itself. Leave null when
      # ComfyUI runs remotely or in Docker.
      comfyui_models_path: null
      workflow_path: null
  video:
    default: hyperframes
    hyperframes:
      quality: high
      # Absolute path to the hyperframes executable (e.g. /usr/local/bin/hyperframes)
      # or to a per-project install's dist/cli.js (invoked via node). Unset by default.
      cli_path: null
      # Explicit command array for per-project installs, e.g. ["npx", "hyperframes"]
      # or ["node", "/abs/path/to/dist/cli.js"]. Takes precedence over cli_path.
      cli_command: null
      # Must be a Linux Chrome/Chromium binary (e.g. Playwright's chrome-linux64/chrome).
      # A Windows Chrome binary will fail (puppeteer reports "Invalid argument").
      # Injected as HYPERFRAMES_BROWSER_PATH.
      chrome_path: null

pipeline:
  video:
    enabled: true
  audio:
    enabled: true
  image:
    enabled: true
  text:
    enabled: true

  # Maximum concurrent pipelines allowed by the MCP server.
  # When the limit is reached, new run_pipeline requests are rejected
  # with INVALID_PARAM until an active pipeline completes or is cancelled.
  max_concurrent_pipelines: 3
