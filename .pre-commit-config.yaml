repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # types-all is uninstallable since types-pkg-resources was yanked
        # from PyPI; mypy runs with --ignore-missing-imports so stubs are
        # not required.
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-secrets
        name: check-secrets (offline credential/URL scan)
        entry: python3 scripts/check-secrets.py
        language: system
        stages: [pre-commit]
        pass_filenames: true
        # Also runs on `pre-commit run --all-files` via git ls-files fallback.
        require_serial: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v1.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # python3 -m pytest puts the repo root on sys.path — required for
        # `from tests.mock_llm import ...` (bare pytest lacks it). Runs in the
        # system interpreter (dev env has pytest; the isolated pre-commit venv
        # only installs the package itself).
        entry: python3 -m pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
      - id: check-doc-consistency
        name: check-doc-consistency
        entry: python3 scripts/check-doc-consistency.py
        language: system
        always_run: true
        pass_filenames: false

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  autofix_commit_msg: "chore: auto-fix pre-commit issues"
  autoupdate_commit_msg: "chore: auto-update pre-commit hooks"
