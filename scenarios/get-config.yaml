name: get-config-baseline
description: The get_config MCP tool returns the merged configuration with secrets redacted.
intent: Prove the configuration surface answers without credentials, so a clean env can read non-secret config through the MCP surface.
category: baseline
user_level: L0
requires_env: []
hard: true
steps:
  - name: get_config returns the merged config
    kind: tool
    check: "get_config returns success: true carrying the redacted merged config dict — the response shape itself (success + config keys), not just the envelope (plan A6 deepening; secret redaction is redteam-credential-exfiltration's scope)."
    standard: tool.contract
    tool: get_config
    arguments: {}
    expect:
      success: true
      output_has:
        - success
        - config
