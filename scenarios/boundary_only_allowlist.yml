# Versioned boundary-only allowlist (gap T-01).
#
# A surface listed here is EXCLUDED from `unproven` while the entry is active.
# Every entry MUST carry an owner and a reason; an optional ISO `expires`
# drops it once past (per-release review, max one release).  This file is
# `.yml` on purpose: the scenario loader globs `*.yaml`, so a `.yaml`
# allowlist would be rejected as a malformed scenario.
#
# Scope: these MCP tools have only an error-boundary probe today.  Wave-2
# T-05 adds a positive-path scenario for each, at which point the entry is
# deleted and the surface becomes `covered`.
