# Versioned boundary-only allowlist (gap T-01).
#
# A surface listed here is EXCLUDED from `unproven` while the entry is active.
# Every entry MUST carry an owner and a reason; an optional ISO `expires`
# drops it once past (per-release review, max one release).  This file is
# `.yml` on purpose: the scenario loader globs `*.yaml`, so a `.yaml`
# allowlist would be rejected as a malformed scenario.
#
# Scope: `run_validation_suite` cannot be success-called without unbounded
# recursion (R-09), so its boundary probe is the honest contract and it stays
# allowlisted.  Wave-2 T-05 added a positive-path scenario for each of the 10
# control/account/config tools that previously had only a boundary probe, so
# none of those needs an entry any more.
version: 1
reviewed: "2026-09-13"
release: "wave2"
entries:
  - surface: mcp
    name: run_validation_suite
    owner: validation-maintainer
    reason: "Cannot be success-called without recursion (R-09); boundary-only by design."
    expires: "2026-12-31"
