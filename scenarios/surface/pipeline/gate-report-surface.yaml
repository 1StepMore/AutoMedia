name: gate-report-surface
description: get_gate_report resolves a synthetic project seeded with a real written gate report under an allowlisted temp base dir and returns the report JSON in a success envelope.
intent: Prove the gate-report read surface returns the per-run 05_review/gate-report/gate-report-*.json payload produced at pipeline completion (no LLM, no write), so agents can inspect per-gate verdicts on a clean env.
category: surface
requires_env: []
steps:
  - name: seed a synthetic project with a written gate report
    kind: cli
    check: "a python3 one-liner writes a synthetic 00_project_info.json (project_id, topic, brand, tenant_id, created_at, status) under /tmp/automedia/todo6-gate-report/projects/ and seeds one gate-report JSON through automedia.pipelines.gate_report.write_gate_report."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import json, pathlib; from automedia.pipelines.gate_engine import GateLogEntry; from automedia.pipelines.gate_report import render_gate_report, write_gate_report; d = pathlib.Path("/tmp/automedia/todo6-gate-report/projects/validation-synthetic"); d.mkdir(parents=True, exist_ok=True); (d / "00_project_info.json").write_text(json.dumps({"project_id": "b7d1f4a9c3e2", "topic": "validation-synthetic", "brand": "todo6-validation-brand", "tenant_id": "", "created_at": "2026-09-05T00:00:00+00:00", "status": "draft"})); write_gate_report(str(d), render_gate_report(str(d), [GateLogEntry(gate_name="CW", status="passed", duration_s=1.0)]))'
    expect:
      exit_code: 0
  - name: get_gate_report returns the structured report envelope
    kind: tool
    check: "get_gate_report returns success: true carrying project_id, report_file, and the report dict (summary with one passing gate) for the synthetic project (verified empirically against /tmp/automedia/todo6-gate-report/projects)."
    standard: tool.contract
    tool: get_gate_report
    arguments:
      project_id: "b7d1f4a9c3e2"
      base_dir: /tmp/automedia/todo6-gate-report/projects
    expect:
      success: true
cleanup_steps:
  - name: remove the synthetic project tree
    kind: cli
    check: rm -rf removes the temp project tree created by this scenario.
    standard: founder-expectations.F01
    command: rm -rf /tmp/automedia/todo6-gate-report
    expect:
      exit_code: 0
