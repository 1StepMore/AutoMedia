name: list-active-pipelines-empty
description: list_active_pipelines answers with a success envelope on a clean isolated config dir (no persistent session tracker file means an empty pipeline list).
intent: Prove the session-tracker listing surface answers without credentials, so agents can inspect running pipelines on a clean env.
category: surface
requires_env: []
steps:
  - name: list_active_pipelines returns the empty session list
    kind: tool
    check: "list_active_pipelines returns success: true carrying pipelines and count (verified empirically: isolated config dir with no active_pipelines.json yields count 0, not an error)."
    standard: tool.contract
    tool: list_active_pipelines
    arguments: {}
    expect:
      success: true
