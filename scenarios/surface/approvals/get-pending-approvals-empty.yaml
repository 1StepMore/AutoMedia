name: get-pending-approvals-empty
description: get_pending_approvals returns the director-mode approval queue in a success envelope; with no active engines the queue is empty (count 0), which is the GREEN-able contract on a clean env.
intent: Prove the approval-queue surface answers a real call (empty-queue assert), so agents can poll for pending director approvals on a clean env.
category: surface
requires_env: []
steps:
  - name: get_pending_approvals returns the empty queue
    kind: tool
    check: "get_pending_approvals returns success: true carrying pending_approvals and count (verified empirically: with no active engines the queue is empty with count 0, not an error)."
    standard: tool.contract
    tool: get_pending_approvals
    arguments: {}
    expect:
      success: true
