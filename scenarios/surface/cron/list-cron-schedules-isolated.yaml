name: list-cron-schedules-isolated
description: list_cron_schedules returns the schedule entries from the isolated pipeline_schedules.yaml in a success envelope.
intent: Prove the cron-schedule listing surface answers on a clean env, so agents can inspect scheduled runs.
category: surface
user_level: L0
requires_env: []
steps:
  - name: list_cron_schedules returns the entries
    kind: tool
    check: "list_cron_schedules returns success: true carrying schedules and count (verified empirically: an absent or empty schedules file yields count 0, not an error)."
    standard: tool.contract
    tool: list_cron_schedules
    arguments: {}
    expect:
      success: true
