name: list-workflows-isolated
description: list_workflows returns the discovered workflow configurations in a success envelope (an isolated config with no workflow files yields an empty list, not an error).
intent: Prove the workflow-listing surface answers on a clean env, so agents can discover reusable workflow definitions.
category: surface
requires_env: []
steps:
  - name: list_workflows returns the workflow list
    kind: tool
    check: "list_workflows returns success: true carrying workflows and count (verified empirically: an isolated config with no workflow files yields count 0, not an error)."
    standard: tool.contract
    tool: list_workflows
    arguments: {}
    expect:
      success: true
