name: add-cron-schedule-isolated
description: add_cron_schedule appends a validated schedule entry to the isolated pipeline_schedules.yaml and returns a success envelope; the paired cleanup removes the entry.
intent: Prove the cron-schedule mutation surface works with a deterministic expression, with a paired cleanup step per guide §4.6.
category: surface
user_level: L0
requires_env: []
steps:
  - name: add_cron_schedule writes the entry
    kind: tool
    check: "add_cron_schedule returns success: true carrying added and name (verified empirically: a valid 5-field expression is accepted and written to the isolated pipeline_schedules.yaml)."
    standard: tool.contract
    tool: add_cron_schedule
    arguments:
      name: w3t1-schedule
      expression: "0 9 * * *"
      brand: w3t1-validation-brand
    expect:
      success: true
cleanup_steps:
  - name: remove_cron_schedule removes the entry
    kind: tool
    check: "remove_cron_schedule removes the w3t1-schedule entry created by this scenario (paired cleanup, guide §4.6); best-effort — cleanup never influences the scenario verdict."
    standard: tool.contract
    tool: remove_cron_schedule
    arguments:
      name: w3t1-schedule
    expect:
      success: true
