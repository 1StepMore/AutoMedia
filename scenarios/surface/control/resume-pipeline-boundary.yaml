name: resume-pipeline-boundary
description: "BOUNDARY-ONLY probe (director-waiver required — never GREEN-asserted): resume_pipeline reports NOT_FOUND for a project_id with no active pipeline in this process (success: false, structured error)."
intent: "Prove the resume control surface's boundary contract. The success path requires a live paused pipeline with a runtime project_id (owned by the lifecycle journeys); on a clean env the honest contract is the structured NOT_FOUND error. The probe passes on error and fails only on full success."
category: surface
user_level: L0
error_boundary: true
hard: true
steps:
  - name: resume_pipeline errors on an unknown project
    kind: tool
    check: "resume_pipeline returns success: false with a structured NOT_FOUND error for a bogus project_id (verified empirically: No active pipeline found for project_id 000000000000)."
    standard: tool.contract
    tool: resume_pipeline
    arguments:
      project_id: "000000000000"
    expect:
      error_expected: true
    error_boundary: true
