# Live HITL approve branch (gap R-03).
#
# The `hitl_pause` fixture starts a REAL H0HumanReviewGate GateEngine in a
# daemon thread, paused at the live HITL wait and registered in the
# in-process `_hitl_waiters` registry.  `review_decision`(approve) resolves
# that live waiter, signals `approve_hitl()`, and the engine resumes and runs
# to completion.  The harness writes a completion marker (`ok: true`,
# `approved: true`) which the CLI step asserts and collects as evidence.
#
# The H0 pause path is LLM-free, so this is deterministic without a model
# provider.

name: hitl-approve-resume
description: "A live H0-paused pipeline is approved through review_decision and resumes to completion, with the completion marker recorded."
intent: "Prove the live HITL approve branch (gap R-03): review_decision resolves a real paused H0 waiter in this process, resumes the engine, and the pipeline completes — not merely a boundary NOT_FOUND probe."
category: surface
user_level: L3
requires_env: []
fixtures:
  - hitl_pause
steps:
  - name: review_decision approves the paused H0 gate
    kind: tool
    check: "review_decision returns success: true with approved: true for the live paused pipeline resolved through _hitl_waiters (the real approve_hitl signal)."
    standard: tool.contract
    tool: review_decision
    arguments:
      project_id: valctrlhitl01
      gate_name: H0
      action: approve
    timeout_seconds: 60
    expect:
      success: true
      output_has:
        - approved
        - gate_name
  - name: approved pipeline resumes to completion
    kind: cli
    check: "The H0 engine resumes after the approval and completes: the harness completion marker records ok: true and approved: true. The python3 assertion prints a stable marker on success."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import json, time, pathlib; time.sleep(1); d = json.loads(pathlib.Path("/tmp/automedia/hitl-live/decision.json").read_text()); assert d["ok"] is True and d["approved"] is True, d; print("hitl-approve-resumed-to-completion")'
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - hitl-approve-resumed-to-completion
    collect_artifacts:
      - path: /tmp/automedia/hitl-live/decision.json
        required: true
cleanup_steps:
  - name: remove the live HITL scratch dir
    kind: cli
    check: "rm -rf removes the harness marker dir created by this scenario."
    standard: founder-expectations.F01
    command: rm -rf /tmp/automedia/hitl-live
    timeout_seconds: 60
    expect:
      exit_code: 0
