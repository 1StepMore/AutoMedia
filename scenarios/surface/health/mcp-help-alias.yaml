name: mcp-help-alias
description: "mcp_help (deprecated alias) returns the same categorized tool manifest as help_mcp (both return categories/tool_count/hint and, as a known product gap, neither wraps via success_response)."
intent: Prove the deprecated manifest alias matches the canonical surface so discovery works under either name.
category: surface
user_level: L0
requires_env: []
steps:
  - name: mcp_help alias returns the tool manifest
    kind: tool
    check: "mcp_help completes and returns the categorized tool listing (categories, tool_count, hint). Known product gap: mcp_help, like help_mcp, returns no success key (verified empirically), so the call completing with the manifest is the honest check."
    standard: founder-expectations.F02
    tool: mcp_help
    arguments: {}
    expect:
      output_has:
        - categories
        - tool_count
        - hint
  - name: help_mcp canonical returns the same shape
    kind: tool
    check: "help_mcp completes and returns the same manifest shape (categories, tool_count, hint) as the alias."
    standard: founder-expectations.F02
    tool: help_mcp
    arguments: {}
    expect:
      output_has:
        - categories
        - tool_count
        - hint
