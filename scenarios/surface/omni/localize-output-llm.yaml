name: localize-output-llm
description: localize_output translates every project draft through OLAdapter (LLM-gated); a missing AUTOMEDIA_LLM_API_KEY gates the scenario to unconfigured. When configured, the tool returns a success envelope even for a project without drafts (warnings note the missing drafts directory).
intent: Prove the project-wide localization surface's envelope contract and the honest unconfigured state without the LLM credential.
category: surface
requires_env:
  - AUTOMEDIA_LLM_API_KEY
steps:
  - name: localize_output returns the per-language result map
    kind: tool
    check: "localize_output returns success: true carrying project_dir, results and warnings (verified empirically: a project without a drafts directory yields a success envelope with a warnings entry, not an error)."
    standard: tool.contract
    tool: localize_output
    arguments:
      project_dir: /tmp/automedia/w3t1-localize-out/proj
      target_langs: en
    expect:
      success: true
