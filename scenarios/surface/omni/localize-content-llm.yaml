name: localize-content-llm
description: localize_content translates markdown through the OL shield pipeline (LLM-gated); it cannot complete without a configured AUTOMEDIA_LLM_API_KEY, so a missing key gates the scenario to unconfigured.
intent: Prove the localization surface's real contract (LLM-gated translation envelope) and the honest unconfigured state when the credential is absent.
category: surface
requires_env:
  - AUTOMEDIA_LLM_API_KEY
steps:
  - name: localize_content returns the translation envelope
    kind: tool
    check: "localize_content returns success: true carrying translated_md, xliff_path and warnings (the OL shield-to-unshield pipeline contract)."
    standard: tool.contract
    tool: localize_content
    arguments:
      md_content: "Hello world"
      source_lang: en
      target_lang: zh
    expect:
      success: true
