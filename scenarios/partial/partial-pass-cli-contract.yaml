# Partial-pass integration scenario (gap R-04) — graceful degradation.
#
# Multi-step integration across the CLI and MCP surfaces: the init help
# contract and the doctor dependency listing both PASS, and the
# pipeline-status surface is probed with a deterministic unknown project id.
# The structured NOT_FOUND refusal IS the degradation the product owes for
# an unknown id, so the probe asserts it directly (success: false + error
# code NOT_FOUND, #719) instead of contradicting it with expect.success.

name: partial-pass-cli-contract
description: "Init help and doctor both pass, and a pipeline-status probe with an unknown project id returns the structured NOT_FOUND refusal — every leg asserts the behaviour the product actually owes."
intent: "Exercise graceful degradation across the CLI and MCP surfaces (gap R-04): an unknown project_id is refused with a structured NOT_FOUND error and stays named in the record instead of being masked."
category: partial
user_level: L0
requires_env: []
min_passing: 2
steps:
  - name: init help contract passes
    kind: cli
    check: "automedia init --help exits 0 and prints the init usage contract — the CLI baseline leg."
    standard: founder-expectations.F02
    command: automedia init --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "Initialize AutoMedia configuration."
  - name: doctor dependency listing passes
    kind: cli
    check: "automedia --json doctor prints the dependency-listing contract (python and ffmpeg appear by name); exit_code is deliberately not asserted (machine-dependent), and error_expected opts in because a missing dependency makes doctor exit non-zero."
    standard: cli.doctor
    command: automedia --json doctor
    timeout_seconds: 60
    expect:
      error_expected: true
      stdout_has:
        - python
        - ffmpeg
  - name: pipeline status degrades for an unknown project
    kind: tool
    check: "get_pipeline_status for an unknown project id returns success: false with a structured NOT_FOUND error — the honest refusal is the expected degradation, so the step asserts it directly (#719)."
    standard: tool.contract
    tool: get_pipeline_status
    arguments:
      project_id: deadbeef00ab
      base_dir: /tmp/automedia/partial-pass
    timeout_seconds: 60
    expect:
      success: false
      error_expected: true
      error_code_has:
        - NOT_FOUND
