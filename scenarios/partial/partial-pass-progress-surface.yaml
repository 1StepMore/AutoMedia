# Partial-pass integration scenario (gap R-04) — graceful degradation.
#
# Multi-step integration across two shipped surfaces: the health check and
# the pipeline control surface both PASS on the seeded in-process tracker,
# and the progress surface is probed with a deterministic unknown project
# id.  The structured NOT_FOUND refusal IS the degradation the product owes
# for an unknown id, so the probe asserts it directly (success: false +
# error code NOT_FOUND, #719) instead of contradicting it with
# expect.success.

name: partial-pass-progress-surface
description: "Health and pause control pass, and a progress probe with an unknown project id returns the structured NOT_FOUND refusal — every leg asserts the behaviour the product actually owes."
intent: "Exercise graceful degradation across the control and progress surfaces (gap R-04): an unknown project_id is refused with a structured NOT_FOUND error and stays named in the record instead of being masked."
category: partial
user_level: L0
requires_env: []
fixtures:
  - pipeline_control
min_passing: 2
steps:
  - name: health check passes
    kind: tool
    check: "health_check returns success: true — the server baseline leg of the integration."
    standard: tool.contract
    tool: health_check
    arguments: {}
    timeout_seconds: 60
    expect:
      success: true
  - name: pause control passes on the tracked pipeline
    kind: tool
    check: "pause_pipeline returns success: true for the seeded tracked pipeline — the control surface leg."
    standard: tool.contract
    tool: pause_pipeline
    arguments:
      project_id: valctrlpipeline1
    timeout_seconds: 60
    expect:
      success: true
  - name: progress probe degrades for an unknown project
    kind: tool
    check: "get_pipeline_progress for an unknown project id returns success: false with a structured NOT_FOUND error — the honest refusal is the expected degradation, so the step asserts it directly (#719)."
    standard: tool.contract
    tool: get_pipeline_progress
    arguments:
      project_id: deadbeef00ab
    timeout_seconds: 60
    expect:
      success: false
      error_expected: true
      error_code_has:
        - NOT_FOUND
