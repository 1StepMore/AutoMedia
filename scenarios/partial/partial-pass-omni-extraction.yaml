# Partial-pass integration scenario (gap R-04) — graceful degradation.
#
# Multi-step integration: a produced fixture artifact is inspected, the OPP
# extraction surface runs against it, and the same surface is probed with a
# path outside the committed MCP allowlist.  The allowlist's fail-closed
# refusal IS the degradation the product owes for an out-of-policy source,
# so the probe asserts it directly (success: false, #719) instead of
# contradicting it with expect.success — the same path-deny contract the
# red-team scenarios pin.

name: partial-pass-omni-extraction
description: "A multi-step OPP extraction integration degrades gracefully: the fixture artifact and a real extraction pass, and a denied-source extraction is refused with success: false — every leg asserts the behaviour the product actually owes."
intent: "Exercise graceful degradation on a real integration (gap R-04): an out-of-allowlist source is refused fail-closed and stays named in the record instead of being masked."
category: partial
user_level: L1
requires_env: []
min_passing: 2
steps:
  - name: committed draft artifact exists and is non-trivial
    kind: file
    check: "The committed synthetic draft scenarios/fixtures/sample-draft.md exists, is non-empty, and is at least 1024 bytes — the produced artifact this integration inspects."
    standard: founder-expectations.F01
    command: scenarios/fixtures/sample-draft.md
    expect:
      artifact_exists: scenarios/fixtures/sample-draft.md
      artifact_nonempty: scenarios/fixtures/sample-draft.md
      artifact_size_min: 1024
    collect_artifacts:
      - path: scenarios/fixtures/sample-draft.md
        required: true
  - name: OPP extraction reads the committed draft
    kind: tool
    check: "extract_brief returns success: true with the extracted markdown content for the committed fixture — the real extraction surface working on a real file."
    standard: tool.contract
    tool: extract_brief
    arguments:
      file_path: scenarios/fixtures/sample-draft.md
    timeout_seconds: 60
    expect:
      success: true
      output_has:
        - md_content
  - name: OPP extraction degrades on a denied source
    kind: tool
    check: "extract_brief on a path outside the committed MCP allowlist returns success: false instead of reading the file — the fail-closed allowlist refusal is the expected degradation, asserted directly like the red-team path-deny steps (#719)."
    standard: tool.contract
    tool: extract_brief
    arguments:
      file_path: /tmp/opencode/partial-pass-denied-source.md
    timeout_seconds: 60
    expect:
      success: false
      error_expected: true
