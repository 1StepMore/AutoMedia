name: redteam-credential-exfiltration
description: "Secret-exfiltration probe: a canary API key placed in the isolated user config never appears in the get_config response, which redacts the secret instead."
intent: "Red Team (T-20): prove the config surface does not exfiltrate secrets. A benign get_config call passes; a real get_config call against a config containing a canary secret is then inspected and the canary must be absent from the serialized response while the redaction marker is present. The finding is recorded as an ordinary run record; the isolated config dir is never the real user config."
category: security
user_level: L0
requires_env: []
steps:
  - name: seed an isolated config with a canary secret
    kind: cli
    check: "python3 writes model_config.yaml with a canary api_key under an isolated AUTOMEDIA_CONFIG_DIR (/tmp/automedia/w2-rt-exfil/config), so the probe never touches ~/.automedia."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import pathlib; base=pathlib.Path("/tmp/automedia/w2-rt-exfil/config"); base.mkdir(parents=True, exist_ok=True); (base/"model_config.yaml").write_text("text_generation:\n  provider: deepseek\n  model: deepseek-chat\n  api_key: sk-REDTEAM-CANARY-9f3a2b\n")'
    expect:
      exit_code: 0
  - name: benign get_config answers
    kind: tool
    check: "get_config returns success: true carrying the merged config — the benign control proving the surface works before the exfiltration assertion runs."
    standard: tool.contract
    tool: get_config
    arguments: {}
    expect:
      success: true
      output_has:
        - config
  - name: the canary secret is not exfiltrated
    kind: cli
    check: "A python subprocess runs get_config against the isolated canary config through the real FastMCP server, asserts the canary string is absent from the serialized response AND the ***REDACTED*** marker is present, then prints the evidence marker. This is the absence assertion the expect vocabulary cannot express; it proves the secret is redacted, not echoed."
    standard: evaluation-matrix.dim7
    command: |-
      env AUTOMEDIA_CONFIG_DIR=/tmp/automedia/w2-rt-exfil/config python3 -c 'import asyncio,json; from automedia.mcp.server import create_server; raw=asyncio.run(create_server().call_tool("get_config",{})); d=raw[1] if isinstance(raw,tuple) and len(raw)==2 and isinstance(raw[1],dict) else (json.loads(getattr(raw[0],"text",str(raw[0]))) if isinstance(raw,list) and raw else raw); blob=json.dumps(d); assert "sk-REDTEAM-CANARY-9f3a2b" not in blob, "SECRET LEAKED"; assert "***REDACTED***" in blob, "no redaction marker"; print("SECRET_NOT_EXFILTRATED")'
    timeout_seconds: 120
    expect:
      exit_code: 0
      stdout_has:
        - SECRET_NOT_EXFILTRATED
cleanup_steps:
  - name: remove the isolated canary config
    kind: cli
    check: rm -rf removes the isolated config dir holding the canary secret.
    standard: founder-expectations.F01
    command: rm -rf /tmp/automedia/w2-rt-exfil
    expect:
      exit_code: 0
