name: hitl-cli-surface
description: automedia hitl --help exits 0 and prints the HITL sub-commands (preset, config), proving the hitl command is registered.
intent: Prove the hitl CLI surface is callable and exposes its real contract (preset/config sub-commands) without modifying any HITL configuration.
category: cli
requires_env: []
steps:
  - name: hitl --help shows sub-commands
    kind: cli
    check: "automedia hitl --help exits 0 and prints usage text naming the HITL sub-commands."
    standard: founder-expectations.F02
    command: automedia hitl --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "HITL"
        - "preset"
