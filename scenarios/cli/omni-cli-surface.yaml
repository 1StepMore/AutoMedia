name: omni-cli-surface
description: automedia omni --help exits 0 and prints the omni sub-commands (start, localize, format-output, ingest), proving the omni command is registered.
intent: Prove the omni CLI surface is callable and exposes its real contract (start, localize, format-output, ingest sub-commands) without launching any servers.
category: cli
user_level: L0
meta: true
requires_env: []
steps:
  - name: omni --help shows sub-commands
    kind: cli
    check: "automedia omni --help exits 0 and prints usage text naming the omni sub-commands."
    standard: founder-expectations.F02
    command: automedia omni --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "start"
        - "localize"
