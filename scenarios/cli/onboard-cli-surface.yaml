name: onboard-cli-surface
description: automedia onboard --help exits 0 and prints the onboarding sub-commands (start, status, list), proving the onboard command is registered.
intent: Prove the onboard CLI surface is callable and exposes its real contract (start/status/list sub-commands) without running the wizard.
category: cli
user_level: L0
meta: true
requires_env: []
steps:
  - name: onboard --help shows sub-commands
    kind: cli
    check: "automedia onboard --help exits 0 and prints usage text naming the onboarding sub-commands."
    standard: founder-expectations.F02
    command: automedia onboard --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "onboarding"
        - "start"
