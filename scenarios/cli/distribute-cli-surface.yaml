name: distribute-cli-surface
description: automedia distribute --help exits 0 and prints the distribution contract (platforms, dry-run options), proving the distribute command is registered.
intent: Prove the distribute CLI surface is callable and exposes its real contract (platforms, dry-run, all options) without triggering any D-gates.
category: cli
requires_env: []
steps:
  - name: distribute --help shows the usage contract
    kind: cli
    check: "automedia distribute --help exits 0 and prints usage text naming the distribution options."
    standard: founder-expectations.F02
    command: automedia distribute --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "distribution"
        - "platforms"
