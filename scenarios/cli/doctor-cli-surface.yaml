name: doctor-cli-surface
description: "automedia --json doctor lists every dependency by name in machine-readable JSON; the listing contract holds on any machine."
intent: "Prove the doctor surface honors its dependency-listing contract. exit_code is deliberately NOT asserted: doctor exits 1 when a dependency is missing, which is machine-dependent."
category: cli
requires_env: []
steps:
  - name: doctor lists every dependency
    kind: cli
    check: "doctor prints a JSON payload naming each dependency (python, ffmpeg, and the rest) with an installed flag."
    standard: cli.doctor
    command: automedia --json doctor
    timeout_seconds: 60
    expect:
      stdout_has:
        - python
        - ffmpeg
