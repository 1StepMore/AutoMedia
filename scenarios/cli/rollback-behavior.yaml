# Behavioural coverage for `automedia rollback` (gap R-05).
#
# The command had only a `--help` surface probe.  This scenario advances a
# synthetic project to `published` with recorded pipeline history (rollback
# eligibility), runs the real rollback non-interactively (`--yes`), and
# asserts the full contract: the project directory is renamed to
# `{name}_archived`, the status is reverted to `draft`, and NO orphan
# directory is left behind.  The archived 00_project_info.json is collected
# as evidence.
#
# Portability (#564): every path is rooted at ${AUTOMEDIA_PROJECTS_DIR} — the
# engine expands it per invocation for argv/file paths, and the python
# one-liners read the same variable from os.environ at runtime — so the
# scenario never pins /tmp and carries no bash-isms (no pipes, no rm, no
# shell built-ins).  The rollback confirmation is skipped via `--yes`
# instead of piping an answer into bash.

name: rollback-behavior
description: "A published project with pipeline history is rolled back: the archive is intact, the status reverts to draft, and no orphan directory remains."
intent: "Prove the rollback CLI compensates an advanced project (gap R-05): the real command archives the directory, reverts the status, and leaves no orphan state, not merely a callable --help surface."
category: cli
user_level: L3
requires_env: []
steps:
  - name: seed a published project with pipeline history
    kind: cli
    check: "a python3 one-liner writes 00_project_info.json (status published) and a non-empty .automedia/history.db with a CW:completed row under the scenario's private ${AUTOMEDIA_PROJECTS_DIR} subtree — the advanced project rollback must compensate."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import json, os, pathlib, sqlite3, time; base = pathlib.Path(os.environ["AUTOMEDIA_PROJECTS_DIR"]) / "rollback-behavior" / "projects" / "projroll"; base.mkdir(parents=True, exist_ok=True); (base / "00_project_info.json").write_text(json.dumps({"project_id": "rollback0001", "topic": "rollback-check", "brand": "my-brand", "tenant_id": "", "created_at": "2026-09-13T00:00:00+00:00", "status": "published"})); import automedia.hooks.pipeline_history as ph; db = pathlib.Path(ph._db_path(str(base))); db.parent.mkdir(parents=True, exist_ok=True); con = sqlite3.connect(str(db)); ph._ensure_schema(con); con.execute("INSERT INTO pipeline_history (project_id, action, timestamp, metadata_json) VALUES (?, ?, ?, ?)", ("rollback0001", "CW:completed", time.time(), json.dumps({"gate": "CW", "project_id": "rollback0001", "passed": True}))); con.commit(); con.close()'
    timeout_seconds: 60
    expect:
      exit_code: 0
  - name: rollback reverts the project
    kind: cli
    check: "automedia rollback with --yes (the interactive confirmation is skipped for non-interactive runs) exits 0 and prints the rollback result naming the archive directory."
    standard: founder-expectations.F01
    command: automedia rollback rollback0001 --base-dir ${AUTOMEDIA_PROJECTS_DIR}/rollback-behavior/projects --yes
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "Rolled back project rollback0001"
        - "projroll_archived"
        - "draft"
  - name: archive is intact and no orphan remains
    kind: cli
    check: "a python3 assertion proves the archive directory exists, the original directory is gone, the archived status is draft, and the base dir holds no orphan directory besides the archive."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import json, os, pathlib; base = pathlib.Path(os.environ["AUTOMEDIA_PROJECTS_DIR"]) / "rollback-behavior" / "projects"; archived = base / "projroll_archived"; assert archived.is_dir(), "archive missing"; assert not (base / "projroll").exists(), "original directory still present"; info = json.loads((archived / "00_project_info.json").read_text()); assert info["status"] == "draft", info["status"]; orphans = sorted(p.name for p in base.iterdir() if p.name != "projroll_archived"); assert not orphans, orphans; print("rollback-reverted-no-orphans")'
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - rollback-reverted-no-orphans
  - name: archived project info is intact
    kind: file
    check: "The archived 00_project_info.json exists and is non-empty — the intact archive evidence."
    standard: founder-expectations.F01
    command: ${AUTOMEDIA_PROJECTS_DIR}/rollback-behavior/projects/projroll_archived/00_project_info.json
    expect:
      artifact_exists: ${AUTOMEDIA_PROJECTS_DIR}/rollback-behavior/projects/projroll_archived/00_project_info.json
      artifact_nonempty: ${AUTOMEDIA_PROJECTS_DIR}/rollback-behavior/projects/projroll_archived/00_project_info.json
    collect_artifacts:
      - path: ${AUTOMEDIA_PROJECTS_DIR}/rollback-behavior/projects/projroll_archived/00_project_info.json
        required: true
cleanup_steps:
  - name: remove the rollback scratch tree
    kind: cli
    check: "a python3 one-liner removes the scenario's private subtree under ${AUTOMEDIA_PROJECTS_DIR} (no shell built-ins)."
    standard: founder-expectations.F01
    command: |-
      python3 -c 'import os, pathlib, shutil; tree = pathlib.Path(os.environ["AUTOMEDIA_PROJECTS_DIR"]) / "rollback-behavior"; shutil.rmtree(tree, ignore_errors=True); assert not tree.exists()'
    timeout_seconds: 60
    expect:
      exit_code: 0
