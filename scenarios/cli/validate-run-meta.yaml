name: validate-run-meta
description: "automedia validate run --scenario <leaf> executes one named scenario through the engine, persists an immutable run record, and exits 0 on a passed scenario."
intent: "Self-host the validate run command (T-06): the suite's own entry point is exercised behaviourally against a bounded, non-recursive leaf scenario (--scenario is the recursion bound), so a static scenario cannot trigger an unbounded validate chain."
category: meta
user_level: L0
meta: true
requires_env: []
steps:
  - name: validate run executes a named scenario
    kind: cli
    check: "automedia validate run --scenario validate-list-meta --runs-root <tmp> exits 0 and reports Status: passed for the named scenario (one bounded engine dispatch, no recursion)."
    standard: founder-expectations.F02
    command: >-
      automedia validate run --scenario validate-list-meta
      --runs-root /tmp/automedia/val-meta-run/runs
    timeout_seconds: 120
    expect:
      exit_code: 0
      stdout_has:
        - "Status: passed"
cleanup_steps:
  - name: remove the validate run scratch root
    kind: cli
    check: rm -rf removes the isolated runs root this scenario persisted into.
    standard: founder-expectations.F01
    command: rm -rf /tmp/automedia/val-meta-run
    expect:
      exit_code: 0
