name: history-cli-surface
description: automedia history --help exits 0 and prints usage naming the required project_id argument, proving the history command is registered.
intent: Prove the history CLI surface is callable and exposes its real contract (project_id argument, base-dir option) without querying any project.
category: cli
user_level: L0
requires_env: []
steps:
  - name: history --help shows the usage contract
    kind: cli
    check: "automedia history --help exits 0 and prints usage text naming the pipeline execution history function."
    standard: founder-expectations.F02
    command: automedia history --help
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "history"
