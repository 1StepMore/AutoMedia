name: validate-list-meta
description: "automedia validate list exposes the validate family (list, run, report, diff, coverage) via a non-recursive meta command. This scenario is EXPECTED RED until W4-T1 ships the validate command."
intent: "Prove the validate family is callable via CLI and lists its sub-commands. The validate command does not exist yet (W4-T1 ships it); this scenario asserts the DESIGN contract (exit 0, stdout_has the sub-command names) and will turn GREEN when W4-T1 is implemented. No other scenario may invoke automedia validate (recursion guard)."
category: cli
requires_env: []
steps:
  - name: validate list shows the sub-command family
    kind: cli
    check: "automedia validate list exits 0 and prints the sub-command names (list, run, report, diff, coverage) — the validate family surface."
    standard: founder-expectations.F02
    command: automedia validate list
    timeout_seconds: 60
    expect:
      exit_code: 0
      stdout_has:
        - "list"
        - "run"
