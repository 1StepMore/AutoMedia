# Versioned registration-only exemptions list (gaps T-06, T-07).
#
# A leaf listed here is reachable but NOT behaviourally exercised by the
# committed scenario library.  Every entry MUST carry an owner and a reason,
# and is reviewed once per release (max one release); an ISO `expires` drops
# the entry once past.  `automedia.validation.cli_leaves` reports a leaf as
# `uncovered` only when it is neither behaviourally covered nor actively
# exempt, and fails loudly on a malformed entry.
version: 1
reviewed: "2026-09-13"
release: "wave2"
entries:
  - surface: cli
    name: account connect
    owner: validation-maintainer
    reason: "Writes an encrypted credential; needs a synthetic master key + isolated store."
    expires: "2026-12-31"
  - surface: cli
    name: account disconnect
    owner: validation-maintainer
    reason: "Mutates the credential store; requires a seeded registered account."
    expires: "2026-12-31"
  - surface: cli
    name: account health
    owner: validation-maintainer
    reason: "Requires a seeded registered account + platform credential."
    expires: "2026-12-31"
  - surface: cli
    name: adapter create
    owner: validation-maintainer
    reason: "Generates a platform adapter stub file (mutating)."
    expires: "2026-12-31"
  - surface: cli
    name: archive
    owner: validation-maintainer
