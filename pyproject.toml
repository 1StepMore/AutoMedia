[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automedia-pipeline"
description = "Automated media production pipeline"
dynamic = ["version"]
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "1StepMore"}]
keywords = ["media", "automation", "pipeline", "mcp", "cli", "video", "content"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"

dependencies = [
    "python-dotenv>=1.0",
    "typer>=0.9,<1",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2,<3",
    "pyyaml>=6.0.2",
    "tenacity>=8",
    "Pillow>=12.2.0,<13",
    "typing_extensions>=4.12",
    "cryptography>=50.0.0,<51",
    "structlog>=24,<27",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/renanzai40/AutoMedia_BackUp"
Repository = "https://github.com/renanzai40/AutoMedia_BackUp"
Documentation = "https://github.com/renanzai40/AutoMedia_BackUp/tree/main/docs"

[project.optional-dependencies]
openai = ["openai>=2.45.0"]
anthropic = ["anthropic>=0.116.0"]
rich = ["rich>=15.0.0"]
mcp = ["mcp>=1.0,<2"]

omni-core = ["lxml>=6", "python-docx>=1.2", "python-pptx>=1.0", "openpyxl>=3.1", "pandas>=2"]
omni-pdf = ["pymupdf>=1.24"]
omni-ml = ["sentence-transformers>=3", "torch>=2.13.0"]
omni = ["automedia-pipeline[omni-core]", "automedia-pipeline[omni-pdf]", "automedia-pipeline[omni-ml]",
        "omni-pre-processor>=0.5.8,<1.0", "omni-localizer>=0.7,<1.0", "omni-re-formatter>=0.4,<1.0"]

# AGPL notice: omni-pdf pulls PyMuPDF (AGPL v3) — ensure compliance before use
all = ["automedia-pipeline[openai]", "automedia-pipeline[anthropic]", "automedia-pipeline[rich]", "automedia-pipeline[mcp]", "automedia-pipeline[omni]", "httpx>=0.28"]
dev = [
    "automedia-pipeline[openai]",
    "automedia-pipeline[anthropic]",
    "automedia-pipeline[httpx]",
    "automedia-pipeline[rich]",
    "automedia-pipeline[mcp]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15.21",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "vulture>=2.10",
    "hypothesis>=6.156.5",
    "interrogate>=1.7",
    "pytest-timeout>=2.3",
]

[project.entry-points.console_scripts]
automedia = "automedia.cli.app:app"

[tool.setuptools.dynamic]
version = {attr = "automedia._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["automedia", "automedia.*"]

[tool.setuptools.package-data]
automedia = ["**/*.yaml", "**/*.j2", "**/*.html", "**/*.json"]

[tool.uv]
environments = [
    "python_version >= '3.13'",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "SIM", "ANN", "C4", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/automedia/.vulture_whitelist.py" = ["F821", "B018", "N999"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

# Frozen hardened modules: enforced strict from the same commit that fixed
# their errors, so the pre-commit mypy hook never sees an unfixed override.
# NOTE: per-module `strict = true` is NOT used. mypy (1.13.0 and 2.1.0) has a
# bug where a per-module `strict` key leaks the strict options to the whole
# program (config_parser.py passes the global set_strict_flags closure into
# per-module section parsing). The explicit flag list below is exactly the
# strict set, restricted to these modules (warn_redundant_casts excluded: not
# a per-module option).
[[tool.mypy.overrides]]
module = [
    "automedia.asset_library.vector_store",
    "automedia.asset_library.migrate",
    "automedia.manifests.brand_profile_schema",
    "automedia.pool.collector",
    "automedia.cli.commands.history_cmd",
    "automedia.cli.commands.pipeline",
    "automedia.core.config_loader",
]
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.vulture]
paths = ["src/automedia/"]
min_confidence = 80

[tool.deptry]
exclude = ["tests/", "scripts/", "deploy/"]
per_rule_ignores = {DEP002 = ["automedia"]}

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
fail-under = 50
exclude = ["tests", "scripts", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not e2e' --timeout=120 --timeout-method=thread --strict-markers"
