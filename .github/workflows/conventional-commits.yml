name: Conventional Commits

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    # `labeled`/`unlabeled` re-run the gate when an override label is added or
    # removed (release:user-visible / release:skip).
    types: [opened, synchronize, edited, labeled, unlabeled]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the configured pattern. The subject must not start with an uppercase letter.

  # release-please decides visibility from the commit TYPE only, so
  # internal-only maintenance typed as a visible type (fix/feat/perf/docs/
  # revert) forces a public release.  This gate makes the type match the
  # changed paths' real release scope, with release:user-visible /
  # release:skip as the explicit override labels.
  release-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # No `--depth=1` fetch here: checkout already provides origin/<base> with
      # full history, and a shallow ref can break the merge-base computation the
      # three-dot diff below needs (fatal: no merge base, or a wrong range).
      - name: Check changed paths against the PR's release scope
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # A release-please proposal's type is bot-fixed and its diff spans the
          # whole release interval, so the type-vs-scope table cannot judge it
          # (issue #134). Author + head ref are what identify one; the script
          # requires all three signals, so a human PR cannot claim the exemption.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            git fetch origin "$BASE_REF"
          fi
          git rev-parse --verify "origin/$BASE_REF^{commit}"
          git diff --name-only "origin/$BASE_REF...HEAD" \
            | python3 scripts/check_release_scope.py --files - --title "$PR_TITLE" \
                --labels "$LABELS" --pr-author "$PR_AUTHOR" --head-ref "$HEAD_REF"
