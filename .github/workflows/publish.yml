# Publish AutoMedia Pipeline to PyPI via Trusted Publishing (OIDC)
#
# Set up at https://pypi.org/manage/project/automedia-pipeline/settings/
# under "Publishing" → "Add a new publisher":
#   - PyPI Project: automedia-pipeline
#   - Owner:        1StepMore
#   - Repository:   AutoMedia
#   - Workflow:     publish.yml
#   - Environment:  pypi
#
# OWNERSHIP NOTE (2026-09): the 1StepMore account suspension has been lifted and
# `1StepMore/AutoMedia` is the canonical repository again. The OIDC binding above
# (Owner 1StepMore / Repository AutoMedia) is therefore correct as written, and
# publishing from this repo works provided the `pypi` GitHub Environment exists in
# repository Settings → Environments. (During the suspension work was mirrored to
# renanzai40/AutoMedia_BackUp; that mirror is no longer canonical.)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Publishing is driven ONLY by `release: published`, never by a bare tag push
# (removed 2026-10-12). A tag is not evidence that a release was intended:
# `automedia-v1.6.0` was tagged locally but never got a GitHub Release — the only
# tag in the sequence without one — so `release: published` correctly never fired
# and 1.6.0 silently never shipped. Pushing that leftover tag later hit the old
# `tags: ["v*", "automedia-v*"]` trigger and published 1.6.0 to PyPI from nowhere.
# Release-object presence is the discriminating signal; do NOT restore the tag
# trigger to "fix" the apparently-missing trigger.
concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Recovery net only, since the tag trigger is gone: a re-run after a
          # partial publish would otherwise die on "400 File already exists" and
          # paint a red check on a release that already shipped.
          skip-existing: true
