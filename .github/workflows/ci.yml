name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/automedia/ --ignore E501,E402,N806,E741
      - name: Doc consistency (numeric claims + doc↔reality audit, W5-T3)
        # W5-T3 reconciliation DECISION (pinned): the W3-T8 doc↔reality
        # audit runs INSIDE check-doc-consistency.py (one doc step, strict
        # superset — numeric claims + table/gate/adapter reality). The step
        # fails on audit findings with severity high/medium; the single
        # permanent LOW note (refuted effects_analyze_content allegation,
        # recommendation "None") is informational — W5-T2 zeroed every
        # high/medium finding, so this pin keeps the gate green-able.
        run: python3 scripts/check-doc-consistency.py
      - name: Doc inventory drift check (T-13)
        # docs/doc-inventory.md is source-generated (scripts/doc_inventory.py);
        # --check regenerates in memory and fails on any byte difference, so a
        # stale committed inventory can never merge.
        run: python3 scripts/doc_inventory.py --check
      - name: Docstring coverage (interrogate)
        continue-on-error: true
        run: interrogate src/automedia/
      - name: Dead code detection (vulture)
        continue-on-error: true
        run: vulture src/automedia/ --min-confidence 80
      - name: Mypy
        continue-on-error: true
        run: mypy src/automedia/ --ignore-missing-imports
      - name: Mypy (strict — hardened modules)
        # Blocking: the 7 modules hardened by the pareto-hardening plan are
        # strict-clean; this locks that gain. The advisory repo-wide Mypy step
        # above stays. Do NOT add continue-on-error here.
        run: mypy --strict src/automedia/asset_library/vector_store.py src/automedia/asset_library/migrate.py src/automedia/manifests/brand_profile_schema.py src/automedia/pool/collector.py src/automedia/cli/commands/history_cmd.py src/automedia/cli/commands/pipeline.py src/automedia/core/config_loader.py --ignore-missing-imports
      - name: Actionlint (workflow validation)
        uses: reviewdog/action-actionlint@v1
        with:
          level: warning
      - name: Check unused dependencies
        continue-on-error: true
        run: |
          pip install deptry
          deptry src/automedia/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
      - name: Cache pytest
        uses: actions/cache@v6
        with:
          path: ~/.cache/pytest
          key: pytest-${{ runner.os }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Security scan (pip-audit)
        continue-on-error: true
        run: |
          pip install "pip-audit>=2.7"
          pip-audit
      - name: Security scan (bandit)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r src/automedia/ -ll
      - name: Pytest
        continue-on-error: ${{ matrix.python-version != '3.11' }}
        run: python3 -m pytest --cov=src/automedia --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -q --tb=short

      - name: Validation coverage audit (T-01; evidence-backed)
        # Evidence-backed coverage (gap T-01): coverage = declared surface ∩
        # surfaces reached by a passed step in the newest persisted run.
        # `missing` (declared-but-unreferenced, Absent) always fails.
        # `unproven` fails once an evidence run exists; this static job has no
        # persisted run, so it reports the unproven set loudly and the
        # operator-facing `automedia validate coverage` is the strict gate
        # (exits 1 while any non-allowlisted surface is unproven or missing).
        if: matrix.python-version == '3.11'
        run: |
          python3 - <<'EOF'
          import sys
          from automedia.validation.coverage import coverage_audit
          audit = coverage_audit(runs_root="validation-runs")
          for surface in ("mcp", "cli", "gates", "modes"):
              print(
                  f"{surface}: covered={len(audit['covered'][surface])} "
                  f"unproven={len(audit['unproven'][surface])} "
                  f"missing={len(audit['missing'][surface])} "
                  f"allowlisted={len(audit['allowlisted'][surface])}"
              )
          print(
              f"evidence_run={audit['evidence_run']} "
              f"confidence={audit['evidence_confidence']}"
          )
          if audit["missing_count"]:
              print(f"FAIL: {audit['missing_count']} absent surface(s)")
              sys.exit(1)
          if audit["evidence_run"] is not None and audit["unproven_count"]:
              print(
                  f"FAIL: {audit['unproven_count']} unproven surface(s) "
                  "with a persisted run"
              )
              sys.exit(1)
          if audit["unproven_count"]:
              print(
                  f"NOT-ACCEPTED (no evidence run): "
                  f"{audit['unproven_count']} unproven surface(s)"
              )
          EOF

      - name: Coverage audit drift check (Tr-03)
        # The committed scenarios/baseline/coverage-audit.json is regenerated
        # here and must match byte-for-byte except for `generated_at` (the one
        # inherently run-specific field). A drift means the committed audit is
        # stale relative to the library/source.
        if: matrix.python-version == '3.11'
        run: |
          python3 - <<'EOF'
          import json
          import sys
          from pathlib import Path
          from automedia.validation.coverage import coverage_audit

          committed_path = Path("scenarios/baseline/coverage-audit.json")
          committed = json.loads(committed_path.read_text(encoding="utf-8"))
          fresh = coverage_audit()
          committed.pop("generated_at", None)
          fresh.pop("generated_at", None)
          if fresh != committed:
              print("FAIL: committed coverage-audit.json drifted from a fresh audit")
              for key in sorted(set(fresh) | set(committed)):
                  if fresh.get(key) != committed.get(key):
                      print(f"  differs: {key}")
                      print(f"    committed: {committed.get(key)!r}")
                      print(f"    fresh:     {fresh.get(key)!r}")
              sys.exit(1)
          print(
              f"OK: committed audit matches fresh regeneration "
              f"(scenario_count={fresh['scenario_count']})"
          )
          EOF

  test-omni:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-omni-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies with [omni] extras
        run: |
          pip install -e ".[dev,omni]"
      - name: Verify Omni packages are importable
        run: python -c "import opp; import ol_mcp; import orf; print('All Omni packages OK')"
      - name: Run Omni adapter tests
        continue-on-error: ${{ matrix.python-version != '3.11' }}
        run: python3 -m pytest tests/test_omni/ -v --tb=short

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Agent-tester validation gate for pull requests (plan W5-T3): maps the
  # PR's changed files to the affected scenario subset via
  # scripts/validation_affected.py, runs it through the real engine, and
  # applies the PINNED exit policy (any scenario FAIL -> exit 1;
  # unconfigured-only -> exit 0 — the env gate short-circuits env-gated
  # scenarios before any dispatch, so this job never makes LLM calls: the
  # job env carries no credentials).
  validation-affected:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Affected-area validation run (mapper -> runner)
        run: |
          changed=$(git diff --name-only origin/main...HEAD || true)
          echo "changed files: ${changed:-<none>}"
          python3 scripts/validation_affected.py $changed > /tmp/affected.txt
          echo "affected scenarios:"; cat /tmp/affected.txt
          python3 scripts/validation_run_affected.py $(cat /tmp/affected.txt)
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: .
          quiet: true
          soft_fail: false
          skip_check: CKV_DOCKER_2
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image for scanning
        run: docker build -t automedia:scan .
      - name: Trivy container scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: automedia:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify systemd unit files
        run: systemd-analyze verify deploy/systemd/automedia-mcp.service deploy/systemd/automedia-cron.service deploy/systemd/automedia-pipeline.service
      - name: Build Docker image (mcp-full profile)
        run: docker compose --profile full build mcp-full
