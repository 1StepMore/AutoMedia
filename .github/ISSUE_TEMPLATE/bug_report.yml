name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Run '...' 2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["1.0.0", "main"]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Python version, OS, LLM provider..."
  - type: input
    id: regression-scenario
    attributes:
      label: Regression scenario
      description: Name of the validation scenario that pins this bug (from scenarios/regression/ or the library). Required — the fix must make it GREEN.
    validations:
      required: true
