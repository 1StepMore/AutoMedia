name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Run '...' 2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: dropdown
    id: version
    attributes:
      label: Version
      options: ["1.0.0", "main"]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Python version, OS, LLM provider..."
  - type: input
    id: regression-lock
    attributes:
      label: What locks this fix against regressing?
      description: >-
        Either the validation scenario that pins this bug (from
        scenarios/regression/ or the library), or — for a repo-infrastructure
        bug such as a CI workflow, a release gate, or a pre-commit hook — the
        repo gate that enforces it. Repo infrastructure is deliberately NOT
        validation-scenario material: `scenarios/` exercises the product
        surface through CLI/MCP, so that invariant belongs in a repo gate
        (see the layering decision in scripts/check-workflow-semantics.py).
        Required either way — name the lock, and make it GREEN.
    validations:
      required: true
